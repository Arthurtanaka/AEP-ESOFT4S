# MoveCity - exemplo de configuração.
# Para usar: copie este arquivo com o nome  config.local.properties  (na mesma pasta do README.md)
# e ajuste os valores. O config.local.properties NÃO vai para o GitHub (está no .gitignore).

# Dados de acesso ao MySQL
db.url=jdbc:mysql://localhost:3306/movecity?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
db.usuario=root
db.senha=SUA_SENHA_AQUI

# Código que o usuário precisa informar para se cadastrar como administrador
codigo.admin=movecity2026

# Porta do servidor web (o sistema abre em http://localhost:PORTA)
servidor.porta=8080
